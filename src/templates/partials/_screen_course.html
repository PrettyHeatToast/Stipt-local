<!-- ── Screen 1b: Course menu ────────────────────────────────────── -->
<div id="screen-course" class="screen">
  <div class="page-content">
    <button class="back-btn" id="course-back-btn" aria-label="Terug naar vakken">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      Terug
    </button>
    <h1 class="page-title">Wat wil je doen?</h1>
    <p id="course-menu-name" class="page-subtitle"></p>

    <div class="card-list">
      <div class="card" tabindex="0" role="button" id="course-new-session">
        <div class="card-title">Nieuwe sessie</div>
        <div class="card-sub">Aanwezigheid registreren met een PIN</div>
      </div>
      <div class="card" tabindex="0" role="button" id="course-edit-session">
        <div class="card-title">Sessie aanpassen</div>
        <div class="card-sub">Punten van een eerdere check-in wijzigen</div>
      </div>
    </div>
  </div>
</div>
