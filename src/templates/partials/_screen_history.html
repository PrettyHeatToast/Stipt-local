<!-- ── Screen 2b: Past sessions ──────────────────────────────────── -->
<div id="screen-history" class="screen">
  <div class="page-content">
    <button class="back-btn" id="history-back-btn" aria-label="Terug">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      Terug
    </button>
    <h1 class="page-title">Sessie aanpassen</h1>
    <p id="history-course-name" class="page-subtitle"></p>

    <div id="history-error" class="banner banner-error" style="display:none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;margin-top:2px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="history-error-msg"></span>
      <button class="banner-close" onclick="closeBanner('history-error')" aria-label="Sluit melding">✕</button>
    </div>

    <div id="history-loading" class="card-list">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>

    <div id="history-list" class="card-list" style="display:none"></div>

    <div id="history-empty" class="empty-state" style="display:none">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <p>Nog geen check-ins met jouw naam in dit vak</p>
    </div>
  </div>
</div>
